<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Sea — Mappa Interattiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg-primary:#0a0a0c; --bg-secondary:rgba(20,20,25,.75); --border-glow:rgba(0,242,254,.3);
  --text-main:#e2e8f0; --text-muted:#94a3b8;
  --blue:#00f2fe; --purple:#b900ff; --red:#ff0055; --orange:#ff9f00; --yellow:#ffee00;
  --green:#00ff66; --neutral:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-main);height:100vh;display:flex;overflow:hidden}
h1,h2,h3{font-family:'Outfit',sans-serif;font-weight:600}
#side-panel{width:340px;flex-shrink:0;background:var(--bg-secondary);border-right:1px solid var(--border-glow);backdrop-filter:blur(12px);z-index:1000;display:flex;flex-direction:column;box-shadow:10px 0 30px rgba(0,0,0,.5);overflow-y:auto;transition:transform .25s ease}
.panel-header{padding:24px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel-header h1{font-size:24px;color:#fff;text-shadow:0 0 10px rgba(0,242,254,.2);margin-bottom:4px}
.panel-header p{font-size:13px;color:var(--text-muted)}
#filters{padding:20px 24px}
.search{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font:inherit;font-size:14px;outline:none;margin-bottom:12px;transition:all .3s ease}
.search:focus{border-color:var(--blue);box-shadow:0 0 8px rgba(0,242,254,.3);background:rgba(255,255,255,.08)}
.count{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.fs{border:1px solid rgba(255,255,255,.08);border-radius:8px;margin-bottom:12px;padding:8px 10px}
.fs legend{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:0 4px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none;margin:3px 0}
.chk input{cursor:pointer}
.legend{list-style:none;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:8px;cursor:pointer;transition:all .2s ease}
.legend li:hover{background:rgba(255,255,255,.05);transform:translateX(4px)}
.legend .swatch{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor;flex-shrink:0}
.legend b{font-size:14px;color:#fff;display:block}
.legend small{font-size:11px;color:var(--text-muted)}
#map{flex:1;height:100%;background:var(--bg-primary)}
/* markers */
.pm .dot{display:flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 6px currentColor;font-size:9px;line-height:1;color:#000;font-weight:700;animation:pmpulse 2.4s infinite}
@keyframes pmpulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pm-tip{background:#16161b;color:#fff;border:1px solid rgba(255,255,255,.1);font-size:11px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.leaflet-popup-content-wrapper{background:#16161b;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-family:'Inter',sans-serif;box-shadow:0 10px 25px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:#16161b}
.pm-title{font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:4px}
.pm-tags{margin:4px 0}.pm-tags .chip{font-size:10px;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;margin-right:4px;text-transform:capitalize}
.pm-coords{font-family:monospace;font-size:11px;color:var(--text-muted);margin-top:4px}
.leaflet-container{font-family:'Inter',sans-serif}
/* toggle button (hidden on desktop) */
#panel-toggle{display:none;position:fixed;top:12px;left:12px;z-index:2000;width:44px;height:44px;border:1px solid var(--border-glow);border-radius:8px;background:var(--bg-secondary);backdrop-filter:blur(12px);color:var(--blue);font-size:22px;cursor:pointer;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#panel-toggle:hover{background:rgba(0,242,254,.15)}
#overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999}
#side-panel{z-index:1000}
/* tablet: narrower panel */
@media (max-width:768px){
  #side-panel{width:280px}
  .panel-header{padding:18px 16px}
  .panel-header h1{font-size:20px}
  #filters{padding:16px}
  .search{font-size:16px;padding:10px 12px}
  .chk{font-size:12px}
  .legend li{padding:6px 10px}
  .legend b{font-size:13px}
}
/* desktop: hide toggle and overlay */
@media (min-width:481px){
  #overlay-bg{display:none !important}
}
/* mobile: panel becomes slide-in overlay, map takes full width */
@media (max-width:480px){
  #panel-toggle{display:flex}
  #side-panel{position:fixed;top:0;left:0;height:100vh;width:85vw;max-width:320px;transform:translateX(-100%);z-index:1001}
  #side-panel.open{transform:translateX(0)}
  #map{width:100vw}
  #side-panel.open ~ #overlay-bg{display:block;z-index:1000}
}
</style>
</head>
<body>
<button id="panel-toggle" onclick="var sp=document.getElementById('side-panel');sp.classList.toggle('open');">&#9776;</button>
<div id="side-panel">
  <div class="panel-header"><h1>Circle Sea</h1><p>Mappa Interattiva di Our Golden Age</p></div>
  <div id="filters">
    <input type="text" id="search" class="search" placeholder="Cerca un luogo…">
    <div id="count" class="count"></div>
    <fieldset id="land-filter" class="fs"><legend>Terre</legend></fieldset>
    <fieldset id="cat-filter" class="fs"><legend>Categorie</legend></fieldset>
    <ul id="legend" class="legend"></ul>
  </div>
</div>
<div id="overlay-bg" onclick="document.getElementById('side-panel').classList.remove('open')"></div>
<div id="map"></div>

const W=PLACES.image.width, H=PLACES.image.height;
const LAND_COLOR={blue:'#00f2fe',purple:'#b900ff',red:'#ff0055',orange:'#ff9f00',yellow:'#ffee00',green:'#00ff66',neutral:'#94a3b8'};
const LAND_LABEL={blue:'Terra Blu',purple:'Terra Viola',red:'Terra Rossa',orange:'Terra Arancione',yellow:'Terra Gialla',green:'Terra Verde',neutral:'Neutro'};
const CAT_LABEL={capital:'Capitale',region:'Regione',settlement:'Insediamento',constellation:'Costellazione',landmark:'Punto di riferimento',province:'Provincia',land:'Terra'};
const CAT_GLYPH={capital:'★',region:'◆',settlement:'●',constellation:'✦',landmark:'▲',province:'▭',land:'■'};
const LAND_ORDER=['blue','purple','red','orange','yellow','green','neutral'];
const CAT_ORDER=['capital','landmark','region','province','settlement','constellation','land'];

const map=L.map('map',{crs:L.CRS.Simple,minZoom:-3,maxZoom:5,zoomControl:false,preferCanvas:true});
L.control.zoom({position:'topright'}).addTo(map);
L.imageOverlay('map.png',[[0,0],[H,W]]).addTo(map);
map.fitBounds([[0,0],[H,W]]);

// render markers
PLACES.places.forEach(p=>{
  const col=LAND_COLOR[p.land]||LAND_COLOR.neutral;
  const big=(p.category==='capital'||p.category==='landmark'||p.category==='region'||p.category==='land');
  const size=p.category==='capital'?18:(big?14:11);
  const icon=L.divIcon({className:'pm',html:'<span class="dot" style="color:'+col+';width:'+size+'px;height:'+size+'px;background:'+col+'">'+(CAT_GLYPH[p.category]||'●')+'</span>',iconSize:[size,size],iconAnchor:[size/2,size/2]});
  const m=L.marker([H-p.y,p.x],{icon}).addTo(map);
  m.bindTooltip(p.name,{direction:'top',offset:[0,-size/2],className:'pm-tip'});
  m.bindPopup('<div class="pm-title" style="color:'+col+'">'+p.name+'</div>'+
    '<div class="pm-tags"><span class="chip" style="border-color:'+col+';color:'+col+'">'+(LAND_LABEL[p.land]||p.land)+'</span><span class="chip">'+(CAT_LABEL[p.category]||p.category)+'</span></div>'+
    '<div class="pm-coords">XY: '+p.x+', '+p.y+'</div>');
  p._marker=m;
});

// build filter checkboxes + legend
const landFs=document.getElementById('land-filter');
LAND_ORDER.forEach(l=>{const c=LAND_COLOR[l];const lbl=document.createElement('label');lbl.className='chk';lbl.innerHTML='<input type="checkbox" data-land="'+l+'" checked><span class="swatch" style="background:'+c+';color:'+c+'"></span>'+(LAND_LABEL[l]||l);landFs.appendChild(lbl);});
const catFs=document.getElementById('cat-filter');
CAT_ORDER.forEach(c=>{const lbl=document.createElement('label');lbl.className='chk';lbl.innerHTML='<input type="checkbox" data-cat="'+c+'" checked>'+(CAT_LABEL[c]||c);catFs.appendChild(lbl);});
const legend=document.getElementById('legend');
LAND_ORDER.forEach(l=>{const c=LAND_COLOR[l];const li=document.createElement('li');li.style.color=c;li.innerHTML='<span class="swatch" style="background:'+c+'"></span><div><b>'+LAND_LABEL[l]+'</b><small>isola questa terra</small></div>';li.onclick=()=>{LAND_ORDER.forEach(x=>{document.querySelector('#land-filter input[data-land="'+x+'"]').checked=(x===l);});applyFilters();};legend.appendChild(li);});

// filtering
const search=document.getElementById('search');
const countEl=document.getElementById('count');
function applyFilters(){
  const q=search.value.trim().toLowerCase();
  let visible=0;
  PLACES.places.forEach(p=>{
    const landOn=document.querySelector('#land-filter input[data-land="'+p.land+'"]').checked;
    const catOn=document.querySelector('#cat-filter input[data-cat="'+p.category+'"]').checked;
    const matchOn=!q||p.name.toLowerCase().includes(q);
    const show=landOn&&catOn&&matchOn;
    if(show){if(!map.hasLayer(p._marker))p._marker.addTo(map);visible++;}
    else{if(map.hasLayer(p._marker))map.removeLayer(p._marker);}
  });
  countEl.textContent=visible+' di '+PLACES.places.length+' luoghi';
}
search.addEventListener('input',applyFilters);
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=search.value.trim().toLowerCase();const m=PLACES.places.find(p=>p.name.toLowerCase().includes(q));if(m){map.flyTo([H-m.y,m.x],3,{duration:.6});m._marker.openPopup();}}});
landFs.addEventListener('change',applyFilters);
catFs.addEventListener('change',applyFilters);
applyFilters();
</script>
</body>
</html>
